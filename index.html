<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Script Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Script Generator</h1>
            <p class="subtitle">Generate production-ready scripts from JSON blueprints</p>
        </header>

        <main>
            <div class="input-section">
                <h2>Input JSON Blueprint</h2>
                <div class="input-controls">
                    <button id="uploadBtn" class="btn btn-secondary">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M10 4V16M10 4L6 8M10 4L14 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M4 12V16C4 17.1046 4.89543 18 6 18H14C15.1046 18 16 17.1046 16 16V12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        Upload JSON File
                    </button>
                    <input type="file" id="fileInput" accept=".json" style="display: none;">
                    <span id="fileName" class="file-name"></span>
                </div>
                <textarea
                    id="jsonInput"
                    placeholder="Paste your JSON blueprint here or upload a file..."
                    spellcheck="false"
                ></textarea>
                <div class="action-bar">
                    <button id="generateBtn" class="btn btn-primary">Generate Script</button>
                    <button id="clearBtn" class="btn btn-secondary">Clear</button>
                </div>
                <div id="errorMessage" class="error-message" style="display: none;"></div>
            </div>

            <div class="output-section">
                <div class="output-header">
                    <h2>Generated Script</h2>
                    <div class="output-controls">
                        <button id="copyBtn" class="btn btn-small" title="Copy to clipboard">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <path d="M4 4V2C4 1.44772 4.44772 1 5 1H13C13.5523 1 14 1.44772 14 2V10C14 10.5523 13.5523 11 13 11H11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                                <rect x="2" y="5" width="9" height="10" rx="1" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                            Copy
                        </button>
                        <button id="downloadBtn" class="btn btn-small" title="Download as text file">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <path d="M8 2V11M8 11L11 8M8 11L5 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M2 11V13C2 14.1046 2.89543 15 4 15H12C13.1046 15 14 14.1046 14 13V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            Download
                        </button>
                    </div>
                </div>
                <div id="output" class="output-content"></div>
            </div>
        </main>

        <footer>
            <p>Built with precision for production-ready script generation</p>
        </footer>
    </div>

    <script src="script-generator.js"></script>
    <script src="app.js"></script>
</body>
</html>
